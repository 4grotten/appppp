version: '3'
volumes:
  postgres_data_dev: { }
  postgres_backup_dev: { }

services:
  django: &django
    build:
      context: .
      dockerfile: Dockerfile
    image: apofiz/backend
    ports:
      - "8000:8000"
    links:
      - postgres:postgres
      - rabbitmq:rabbitmq
      - memcached:memcached
      - redis:redis
    depends_on:
      - rabbitmq
      - postgres
      - memcached
      - redis
    env_file: ./env/test.env
    volumes:
      - .:/app
      - ./static:/app/static
      - ./media:/app/media
    command: /gunicorn.sh
    restart: always

  celery_worker:
    <<: *django
    ports: [ ]
    command: /celery_worker.sh
    env_file: ./env/test.env

  daphne:
    build: .
    command: daphne -b 0.0.0.0 -p 8001 project.asgi:application
    ports:
      - "8001:8001"
    env_file: ./env/test.env
    depends_on:
      - django

  postgres:
    image: mdillon/postgis:10
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
      - postgres_backup_dev:/backups
    env_file: ./env/test.env
    restart: always

  rabbitmq:
    image: rabbitmq:3.8-alpine
    env_file: ./env/test.env
    restart: always

  memcached:
    image: memcached:1.6-alpine
    env_file: ./env/development.env

  celery_beat:
    <<: *django
    ports: [ ]
    command: celery -A project beat --schedule /app/beat.db --loglevel=INFO
    env_file: ./env/test.env

  redis:
    image: redis:latest
    ports:
      - "6379:6379"
