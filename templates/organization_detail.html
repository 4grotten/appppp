<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta property="og:type" content="website"/>
    <meta property="og:site_name" content="Apofiz"/>
    {% if organization %}
        <title>{{ organization.title }} - Apofiz</title>
        <meta property="og:title" content="{{ organization.title }}"/>
        <meta property="og:description" content="{{ description }}"/>
        <meta property="og:image" content="{{ image_url }}"/>
        <meta property="og:url" content="{{ og_url }}"/>
    {% else %}
        <title>Apofiz</title>
        <meta property="og:title" content="Apofiz - Социально-торговая сеть"/>
        <meta property="og:description" content="Вам больше не надо открывать интернет-магазин, искать новых клиентов, запускать и тратить деньги на продвижение своего сайта."/>
        <meta property="og:image" content="https://apofiz.com/static/assets/logo192.png"/>
        <meta property="og:url" content="https://apofiz.com"/>
    {% endif %}
    <script>
        // Bots read meta tags above, browsers get redirected to SPA
        // Remove trailing slash to match SPA route format
        var path = window.location.pathname.replace(/\/$/, '');
        window.location.replace(path + window.location.search + window.location.hash);
    </script>
</head>
<body>
    <p>Redirecting...</p>
</body>
</html>
