version: '3'
volumes:
  postgres_data_dev: {}
  postgres_backup_dev: {}


services:
  django: &django
    build:
        context: .
        dockerfile: Dockerfile
    image: apofiz/backend
    ports:
      - "0.0.0.0:8000:8000"
    links:
      - postgres:postgres
      - rabbitmq:rabbimq
    depends_on:
      - rabbitmq
      - postgres
    env_file: development.env
    volumes:
      - .:/app
      - ./static:/app/static
      - ./media:/app/media
    command: python manage.py runserver 0.0.0.0:8000
  woker:
    <<: *django
    ports: [ ]
    command: ["celery", "-A", "project", "worker", "--loglevel=INFO"]
    env_file: development.env


  postgres:

    image: mdillon/postgis:10
    ports:
      - "0.0.0.0:5430:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
      - postgres_backup_dev:/backups
    env_file: development.env

  rabbitmq:
    image: rabbitmq:3.8-alpine
    env_file: development.env