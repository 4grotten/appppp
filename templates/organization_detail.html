<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <link rel="icon" href="https://apofiz.com/static/assets/favicon.ico" />

    {% if organization %}
    <title>{{ organization.title }}</title>
    <meta property="og:title" content="{{ organization.title }}" />
    <meta property="og:description" content="{{ description }}" />
    <meta name="description" content="{{ description }}" />

    {% if organization.image %}
    <meta property="og:image" content="https://apofiz.com{{ organization.image.file.url }}" />
    {% else %}
    <meta property="og:image" content="https://apofiz.com/static/assets/logo192.png" />
    {% endif %}

    {% else %}
    <title>Apofiz</title>
    <meta property="og:title" content="Apofiz" />
    <meta property="og:description" content="Социально-торговая сеть" />
    <meta property="og:image" content="https://apofiz.com/static/assets/logo192.png" />
    {% endif %}

    <link href="https://apofiz.com/static/0.css" rel="stylesheet">
</head>

<body>
    <div id="root">
        {% if organization %}
        <div style="padding: 20px;">
            <h1>{{ organization.title }}</h1>
            <p>{{ description }}</p>
            {% if organization.image %}
            <img src="https://apofiz.com{{ organization.image.file.url }}" style="max-width: 300px;">
            {% endif %}
        </div>
        {% endif %}
    </div>
</body>

</html>
