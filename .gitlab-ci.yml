image: python:3.8-alpine3.10

#variables:
#  DOCKER_HOST: tcp://docker:2375/

services:
  - docker:dind

stages:
  - test

run_tests:
  image: docker:stable-dind
  stage: test
  before_script:
    - apk add --no-cache py-pip
    - pip install docker-compose==1.23.2
  script:
    - docker-compose -f docker-compose.base.yml -f docker-compose.tests.yml up --build --exit-code-from app app
  coverage: "/TOTAL.+ ([0-9]{1,3}%)/"
  artifacts:
    reports:
      cobertura: coverage.xml
      junit: junittestreport.xml
  only:
    refs:
      - merge_requests
      - dev
      - master
