version: '3'
volumes:
  postgres_data_dev: { }
  postgres_backup_dev: { }


services:
  django: &django
    build:
      context: .
      dockerfile: Dockerfile
    image: apofiz/backend
    ports:
      - "0.0.0.0:8000:8000"
    links:
      - postgres:postgres
      - rabbitmq:rabbimq
      - memcached:memcached
    depends_on:
      - rabbitmq
      - postgres
      - memcached
      - elasticsearch
    env_file: ./env/development.env
    volumes:
      - .:/app
      - ./static:/app/static
      - ./media:/app/media
    command: /runserver.sh
  woker:
    <<: *django
    ports: [ ]
    command: /celery_worker.sh
    env_file: ./env/development.env

  elasticsearch:
    image: elasticsearch:7.4.0
    ports:
      - "9200:9200"
      - "9300:9300"
    environment:
      - discovery.type=single-node
  postgres:
    image: mdillon/postgis:10
    ports:
      - "0.0.0.0:5430:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
      - ./backups:/backups
    env_file: ./env/development.env

  rabbitmq:
    image: rabbitmq:3.8-alpine
    env_file: ./env/development.env

  memcached:
    image: memcached:1.6-alpine
    env_file: ./env/development.env

  celery_beat:
    <<: *django
    ports: [ ]
    command: celery -A project beat --schedule /app/beat.db --loglevel=INFO
    env_file: ./env/development.env
