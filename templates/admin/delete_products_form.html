{% extends "admin/base_site.html" %}
{% load static %}

{% block content %}
<h1>Удаление товаров для "{{ organization.title }}"</h1>
<form method="post" onsubmit="return confirmDelete()">
    {% csrf_token %}
    <p><strong>Выберите категории для удаления:</strong></p>

    <div style="margin-bottom: 1rem;">
        <label>
            <input type="checkbox" name="categories" value="all" onclick="toggleAll(this)">
            <strong>Все категории</strong>
        </label>
        <br>
        {% for category in categories %}
        <label>
            <input type="checkbox" name="categories" value="{{ category.id }}">
            {{ category.name }}
        </label><br>
        {% endfor %}
    </div>

    <button type="submit" class="button btn btn-danger">
        Удалить выбранные товары
    </button>
    <a href="../change/" class="button">Отмена</a>
</form>

<script>
    function toggleAll(checkbox) {
        const checkboxes = document.querySelectorAll('input[name="categories"]');
        checkboxes.forEach(cb => {
            if (cb !== checkbox) cb.checked = checkbox.checked;
        });
    }

    function confirmDelete() {
        const checked = document.querySelectorAll('input[name="categories"]:checked');
        if (checked.length === 0) {
            alert("Выберите хотя бы одну категорию!");
            return false;
        }

        return confirm("Вы уверены что хотите удалить товары выбранных категорий? это действие удалит все товары связанные с организацие и категорией!");
    }
</script>
{% endblock %}
