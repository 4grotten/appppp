version: '3'
volumes:
  postgres_data_dev: { }
  postgres_backup_dev: { }
  waha_sessions: { }
  waha_files: { }

services:
  django: &django
    build:
      context: .
      dockerfile: Dockerfile
    image: apofiz/backend
    ports:
      - "8000:8000"
    links:
      - postgres:postgres
      - rabbitmq:rabbitmq
      - memcached:memcached
      - redis:redis
      - waha:waha
    depends_on:
      - rabbitmq
      - postgres
      - memcached
      - redis
      - waha
    env_file: ./env/test.env
    volumes:
      - .:/app
      - ./static:/app/static
      - ./media:/app/media
    command: /gunicorn.sh
    restart: always
  
  gemini-api:
    build: ./gemini_service
    ports:
      - "8002:8002"
    volumes:
      - ./gemini_service:/app
    env_file:
      - .env
    restart: on-failure

  celery_worker:
    <<: *django
    ports: [ ]
    command: /celery_worker.sh
    env_file: ./env/test.env

  daphne:
    build: .
    command: daphne -b 0.0.0.0 -p 8001 project.asgi:application
    ports:
      - "8001:8001"
    env_file: ./env/test.env
    depends_on:
      - django

  postgres:
    image: mdillon/postgis:10
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
      - postgres_backup_dev:/backups
    env_file: ./env/test.env
    restart: always

  rabbitmq:
    image: rabbitmq:3.8-alpine
    env_file: ./env/test.env
    restart: always

  memcached:
    image: memcached:1.6-alpine
    env_file: ./env/test.env
    restart: always

  celery_beat:
    <<: *django
    ports: [ ]
    command: sh -c "rm -f /app/celerybeat.pid && celery -A project beat --schedule /app/beat.db --loglevel=INFO --pidfile=/app/celerybeat.pid"
    env_file: ./env/test.env

  redis:
    image: redis:6.2.6
    env_file: ./env/test.env
    restart: always

  waha:
    image: devlikeapro/waha-plus:latest
    container_name: appofiz_waha_test
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 8.8.4.4
    env_file: ./env/test.env
    environment:
      # WAHA Plus Core Settings
      - WAHA_DASHBOARD_ENABLED=true
      - WHATSAPP_DEFAULT_ENGINE=NOWEB
      - WAHA_LOG_LEVEL=info
      - WAHA_API_KEY=${WAHA_API_KEY}
      - WAHA_DASHBOARD_USERNAME=${WAHA_DASHBOARD_USERNAME}
      - WAHA_DASHBOARD_PASSWORD=${WAHA_DASHBOARD_PASSWORD}
      # Webhook Configuration
      - WHATSAPP_HOOK_URL=https://test.apofiz.com/api/v1/messenger-bots/whatsapp/waha/webhook/
      - WHATSAPP_HOOK_EVENTS=message,message.ack,message.reaction,session.status,message.waiting
      # WAHA Plus Optimizations
      - WAHA_WORKER_RESTART_SESSIONS=true
      - WHATSAPP_RESTART_ALL_SESSIONS=true
      - WAHA_PRINT_QR=false
      - WHATSAPP_FILES_LIFETIME=180
    volumes:
      - waha_sessions:/app/.sessions
      - waha_files:/app/.media
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/sessions"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    mem_limit: 512m
    mem_reservation: 256m
    ports:
      - "3000:3000"


  easycard:
    build:
      context: ../EasyCard
      dockerfile: Dockerfile
    image: apofiz/easycard
    ports:
      - "3001:80"
    restart: on-failure
