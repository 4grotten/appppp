version: '3'
volumes:
  postgres_data_dev: { }
  postgres_backup_dev: { }


services:
  django: &django
    build:
      context: .
      dockerfile: Dockerfile
    image: apofiz/backend
    ports:
      - "0.0.0.0:8000:8000"
    links:
      - postgres:postgres
      - rabbitmq:rabbitmq
      - memcached:memcached
      - redis:redis
    depends_on:
      - rabbitmq
      - postgres
      - memcached
      - redis
    env_file: ./env/development.env
    volumes:
      - .:/app
      - ./static:/app/static
      - ./media:/app/media
    command: /runserver.sh

    restart: on-failure

  woker:
    <<: *django
    ports: [ ]
    command: /celery_worker.sh
    env_file: ./env/development.env
    restart: on-failure


  daphne:
    build: .
    command: daphne -b 0.0.0.0 -p 8001 project.asgi:application
    ports:
      - "8001:8001"
    env_file: ./env/development.env
    depends_on:
      - django
    volumes:
      - .:/app
    restart: on-failure


  postgres:
    image: mdillon/postgis:10
    ports:
      - "0.0.0.0:5430:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
      - ./backups:/backups
    env_file: ./env/development.env
    restart: on-failure


  rabbitmq:
    image: rabbitmq:3.8-alpine
    env_file: ./env/development.env
    restart: on-failure


  memcached:
    image: memcached:1.6-alpine
    env_file: ./env/development.env
    restart: on-failure


  celery_beat:
    <<: *django
    ports: [ ]
    command: celery -A project beat --schedule /app/beat.db --loglevel=INFO
    env_file: ./env/development.env
    restart: on-failure


  redis:
    image: redis:6.2.6
    env_file: ./env/development.env
    restart: always

