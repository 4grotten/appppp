# ================================
# Gitlab CI/CD нормальный рабочий
# ================================

stages:
  - build
  - test
  - staging
  - prod

# ------------
# Build stage
# ------------
build:
  stage: build
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    BUILD_IMAGE_NAME: $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_NAME
  script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker build --target production -t $BUILD_IMAGE_NAME .
    - docker push $BUILD_IMAGE_NAME
  rules:
    # Срабатывает только при MR
    - if: $CI_MERGE_REQUEST_ID


# ---------
# Test stage
# ---------
test:
  stage: test
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    BUILD_IMAGE_NAME: $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_NAME
  script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker run --rm $BUILD_IMAGE_NAME python manage.py test
  rules:
    - if: $CI_MERGE_REQUEST_ID

# --------------------
# STAGE DEPLOY
# --------------------

staging:
  stage: staging
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_STAGING_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - ssh-keyscan test.apofiz.com >> ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
  script:
    - ssh root@45.137.190.28 "
        docker login -u $CI_DEPLOY_USER -p $CI_DEPLOY_PASSWORD $CI_REGISTRY &&
        docker pull $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_NAME &&
        docker stop myapp_web || true &&
        docker rm myapp_web || true &&
        docker run -d --name myapp_web --restart always --env-file /root/.env \
        -p 8000:8000 $CI_REGISTRY_IMAGE:CI_COMMIT_REF_NAME
    "
  
  rules:
    - if: '$CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "dev"'

