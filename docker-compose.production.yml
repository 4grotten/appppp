version: '3'
volumes:
  postgres_data_dev: {}
  postgres_backup_dev: {}


services:
  django: &django
    build:
        context: .
        dockerfile: Dockerfile
    image: apofiz/backend
    ports:
      - "0.0.0.0:8000:8000"
    links:
      - postgres:postgres
      - rabbitmq:rabbimq
    depends_on:
      - rabbitmq
      - postgres
    env_file: ./env/production.env
    command: /gunicorn.sh

  celery_worker_backend:
    <<: *django
    ports: [ ]
    command: /celery_worker.sh
    env_file: ./env/production.env

  postgres:
    image: mdillon/postgis:10
    ports:
      - "0.0.0.0:5430:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
      - postgres_backup_dev:/backups
    env_file: ./env/production.env

  rabbitmq:
    image: rabbitmq:3.8-alpine
    env_file: ./env/production.env